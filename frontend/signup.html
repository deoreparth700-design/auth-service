```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>auth-service — sign up</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0B0E14;
      --card: #12161F;
      --line: #1F2530;
      --text: #E4E7EC;
      --muted: #6B7280;
      --accent: #4F7CFF;
      --accent-dim: #324B8F;
      --error: #FF6B6B;
      --success: #5ED6A4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .wrap {
      width: 100%;
      max-width: 380px;
    }

    .status-line {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
      letter-spacing: 0.02em;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 3px rgba(79, 124, 255, 0.15);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 32px 28px 28px;
    }

    h1 {
      font-size: 19px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .sub {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 26px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 12px;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }

    input {
      background: #0D1017;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 11px 12px;
      color: var(--text);
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.15s ease;
    }

    input::placeholder {
      color: #454C5A;
    }

    input:focus {
      border-color: var(--accent);
    }

    input:focus-visible {
      box-shadow: 0 0 0 3px rgba(79, 124, 255, 0.18);
    }

    .message {
      display: none;
      font-size: 12.5px;
      font-family: 'JetBrains Mono', monospace;
    }

    .message.show {
      display: block;
    }

    .error {
      color: var(--error);
    }

    .success {
      color: var(--success);
    }

    button {
      margin-top: 6px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 12px;

      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    button:hover {
      background: #3E68E0;
    }

    button:disabled {
      background: var(--accent-dim);
      cursor: not-allowed;
    }

      margin-top: 20px;

  </style>
</head>

<body>

  <div class="wrap">

    <div class="status-line">
      <span class="status-dot"></span>
      <span id="statusText">POST /api/auth/signup</span>
    </div>

    <div class="card">

      <h1>Create account</h1>

      <p class="sub">Create your auth-service account</p>

      <form id="signupForm">

        <div class="field">
          <label for="name">NAME</label>
          <input
            type="text"
            id="name"
            placeholder="Your name"
            required
          >
        </div>

        <div class="field">
          <label for="email">EMAIL</label>
          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            required
            autocomplete="email"
          >
        </div>

        <div class="field">
          <label for="password">PASSWORD</label>
          <input
            type="password"
            id="password"
            placeholder="Minimum 8 characters"
            required
            autocomplete="new-password"
          >
        </div>

        <div class="field">
          <label for="confirmPassword">CONFIRM PASSWORD</label>
          <input
            type="password"
            id="confirmPassword"
            placeholder="Repeat password"
            required
            autocomplete="new-password"
          >
        </div>

        <p class="message error" id="errorMsg"></p>
        <p class="message success" id="successMsg"></p>

        <button type="submit" id="submitBtn">
          Create account
        </button>

      </form>

      <p class="foot">
        Already have an account?
        <a href="/login.html">Sign in</a>
      </p>

    </div>

  </div>

  <script>
    const form = document.getElementById("signupForm");
    const btn = document.getElementById("submitBtn");
    const errorMsg = document.getElementById("errorMsg");
    const successMsg = document.getElementById("successMsg");
    const statusText = document.getElementById("statusText");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      errorMsg.classList.remove("show");
      successMsg.classList.remove("show");

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        errorMsg.textContent = "Passwords do not match.";
        errorMsg.classList.add("show");
        return;
      }

      if (password.length < 8) {
        errorMsg.textContent =
          "Password must be at least 8 characters.";
        errorMsg.classList.add("show");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Creating account...";
      statusText.textContent =
        "POST /api/auth/signup → pending";

      try {
        const response = await fetch("/api/auth/signup", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            name,
            email,
            password
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.detail || "Unable to create account"
          );
        }

        statusText.textContent =
          "POST /api/auth/signup → 200";

        successMsg.textContent =
          "Account created successfully. Redirecting...";

        successMsg.classList.add("show");

        setTimeout(() => {
          window.location.href = "/login.html";
        }, 1200);

      } catch (error) {

        console.error("Signup error:", error);

        statusText.textContent =
          "POST /api/auth/signup → error";

        errorMsg.textContent = error.message;
        errorMsg.classList.add("show");

      } finally {

        btn.disabled = false;
        btn.textContent = "Create account";

      }
    });
  </script>

</body>
</html>
